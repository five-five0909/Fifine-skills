interface:
  display_name: "fifine-adaptive-runtime-orchestrator"
  short_description: "Detect runtime, choose executor/shell, poll long jobs, and run measure-first performance diagnosis."
  default_prompt: "Run or optimize this long task safely: detect runtime, baseline, monitor, and report measured results."

triggers:
  - "/fifine-adaptive-runtime-orchestrator"
  - "long-running task"
  - "background job"
  - "wait for job"
  - "长任务"
  - "后台任务"
  - "轮询"
  - "nohup"
  - "timeout"
  - "performance tuning"
  - "benchmark"
  - "profiling"
  - "性能诊断"
  - "性能优化"
