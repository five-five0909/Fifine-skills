interface:
  display_name: "fifine-handoff"
  short_description: "Goal-directed session handoff: write a disposable handoff file plus a paste-ready first message for a fresh agent session."
  default_prompt: "Hand off this session with a goal for the next one."

triggers:
  - "/fifine-handoff"
  - "handoff"
  - "hand off this session"
  - "start a new session for"
  - "continue in a new session"
  - "交接文档"
  - "会话续接"
